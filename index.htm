<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="NOVA SHOP — современный интернет-магазин">
<title>NOVA SHOP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<style>
:root{
  --bg:#07080c;
  --card:#11131a;
  --card2:#171923;
  --line:#ffffff12;
  --muted:#8d90a0;
  --text:#fff;
  --a:#8b6cff;
  --a2:#5b3be0;
  --green:#35d39a;
  --red:#ff5e72;
  --yellow:#ffc857
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 80% -10%,#30235b 0,transparent 34%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;color:inherit}

.app{
  max-width:1200px;
  margin:auto;
  padding-bottom:105px
}

.top{
  display:flex;
  gap:12px;
  align-items:center;
  padding:20px
}

.logo{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#a38aff,#5b3be0);
  font-size:24px
}

.hello{flex:1}
.hello small{display:block;color:var(--muted)}
.hello b{font-size:20px}

.icon{
  width:45px;
  height:45px;
  border-radius:15px;
  background:var(--card);
  border:1px solid var(--line);
  font-size:21px
}

.search{
  margin:0 20px;
  height:55px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:10px
}

.search input{
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:#fff
}

.section{padding:25px 20px 0}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px
}

.head h2{margin:0;font-size:20px}

.link{
  color:#a68fff;
  font-weight:800;
  cursor:pointer
}

.cats{
  display:flex;
  gap:11px;
  overflow:auto
}

.cat{
  min-width:84px;
  text-align:center
}

.catbox{
  height:68px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-size:27px
}

.cat span{
  display:block;
  margin-top:7px;
  color:#c4c5cc;
  font-size:12px
}

.hero{
  margin:24px 20px 0;
  padding:24px;
  border-radius:28px;
  background:linear-gradient(125deg,#2b2055,#11131a 75%);
  border:1px solid var(--line);
  min-height:190px
}

.hero small{
  color:#b9aaff;
  font-weight:900;
  letter-spacing:1px
}

.hero h1{
  font-size:38px;
  margin:10px 0 4px
}

.hero p{
  color:#aaaabd;
  margin:0
}

.btn{
  padding:12px 17px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--a),var(--a2));
  font-weight:900
}

.btn.light{
  background:#fff;
  color:#111
}

.btn:disabled,
.add:disabled{
  opacity:.4;
  cursor:not-allowed
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.product{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden
}

.photo{
  height:230px;
  position:relative;
  background:#191b24
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.heart{
  position:absolute;
  right:10px;
  top:10px;
  width:36px;
  height:36px;
  border-radius:12px;
  background:#0009
}

.heart.on{color:#ff5870}

.rating{
  position:absolute;
  left:10px;
  bottom:10px;
  background:#000b;
  border-radius:9px;
  padding:5px 8px;
  font-size:11px;
  font-weight:900
}

.pinfo{padding:12px}
.muted{color:var(--muted)}
.cattext{font-size:11px;color:#737685}

.pname{
  font-weight:850;
  margin:5px 0 9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.pr{
  display:flex;
  align-items:center;
  gap:7px
}

.price{
  font-weight:950;
  font-size:17px
}

.old{
  text-decoration:line-through;
  color:#686b78;
  font-size:11px
}

.add{
  margin-left:auto;
  width:35px;
  height:35px;
  border-radius:11px;
  background:linear-gradient(135deg,var(--a),var(--a2));
  font-size:23px
}

.bottom{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(760px,calc(100% - 20px));
  height:72px;
  background:#101117ee;
  border:1px solid var(--line);
  backdrop-filter:blur(18px);
  border-radius:25px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 20px 60px #0009
}

.nav{
  background:none;
  color:#777987;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
  min-width:60px
}

.nav i{
  font-style:normal;
  font-size:21px
}

.nav.active{color:#a58cff}

.badge{
  background:#ff536a;
  color:#fff;
  border-radius:10px;
  padding:2px 6px;
  font-size:9px;
  position:absolute;
  margin:-2px 0 0 18px
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  backdrop-filter:blur(8px);
  display:none;
  z-index:100;
  align-items:flex-end
}

.modal.show{display:flex}

.sheet{
  width:100%;
  max-height:94vh;
  overflow:auto;
  background:#101117;
  border:1px solid var(--line);
  border-radius:30px 30px 0 0;
  padding:20px
}

.handle{
  width:44px;
  height:4px;
  background:#444754;
  border-radius:9px;
  margin:0 auto 18px
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.sheet h2{
  margin:0;
  font-size:25px
}

.close{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#20222b
}

.form{
  display:grid;
  gap:12px;
  margin-top:18px
}

.field label{
  display:block;
  color:#a8a9b5;
  font-size:12px;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#171923;
  color:#fff;
  outline:0
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#8b6cff
}

.field textarea{
  min-height:90px;
  resize:vertical
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.full{grid-column:1/-1}

.cartitem{
  display:flex;
  gap:12px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}

.cartitem img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:14px
}

.cartmain{flex:1}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:7px
}

.qty button{
  width:28px;
  height:28px;
  border-radius:9px;
  background:#252733
}

.summary{
  background:#171923;
  border-radius:18px;
  padding:15px;
  margin-top:16px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:8px 0
}

.total{
  font-size:20px;
  font-weight:950
}

.paybox{
  background:#171923;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-top:12px
}

.option{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  margin:8px 0;
  background:#12141b
}

.option.selected{
  border-color:var(--a);
  background:#1a1630
}

.map{
  height:340px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--line);
  margin-top:12px
}

.leaflet-container{background:#151820}

.detailgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px
}

.detailimg{
  width:100%;
  height:480px;
  object-fit:cover;
  border-radius:25px
}

.timeline .step{
  display:flex;
  gap:12px;
  margin:18px 0
}

.dot{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#2a214d;
  color:#ad99ff
}

.navtabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:15px 0
}

.tab{
  padding:10px 13px;
  border-radius:12px;
  background:#171923;
  color:#aaa;
  white-space:nowrap
}

.tab.active{
  background:#2a214d;
  color:#fff
}

.adminstat{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.stat{
  padding:14px;
  border-radius:17px;
  background:var(--card);
  border:1px solid var(--line)
}

.stat b{
  display:block;
  font-size:22px;
  margin-top:4px
}

.admincard,
.request,
.ordercard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:19px;
  padding:15px;
  margin:10px 0
}

.adminrow{
  display:flex;
  gap:12px;
  align-items:center
}

.adminrow img{
  width:70px;
  height:70px;
  border-radius:14px;
  object-fit:cover
}

.grow{flex:1}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.mini{
  padding:9px 11px;
  border-radius:11px;
  background:#242631;
  font-weight:750
}

.mini.primary{
  background:#2a214d;
  color:#c8bcff
}

.mini.danger{
  background:#3a1d25;
  color:#ff8b99
}

.routegrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.point{
  padding:13px;
  border-radius:15px;
  background:#171923;
  border:1px solid var(--line)
}

.point small{
  display:block;
  color:var(--muted);
  margin-bottom:4px
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 15px
}

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:98px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#fff;
  color:#111;
  padding:12px 17px;
  border-radius:13px;
  font-weight:850;
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.hidden{display:none!important}

.rolebanner{
  padding:12px 20px
}

.rolebanner>div{
  padding:12px 15px;
  border-radius:15px;
  background:#171923;
  border:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center
}

.rolebanner b{color:#b8a7ff}

.admin-layout{
  min-height:65vh
}

.admin-title{
  padding:5px 0 18px
}

.admin-title h1{
  margin:0;
  font-size:30px
}

.admin-title p{
  margin:5px 0 0;
  color:var(--muted)
}

.admin-menu{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px
}

.admin-menu button{
  padding:12px 15px;
  border-radius:13px;
  background:#171923;
  border:1px solid var(--line)
}

.admin-menu button.active{
  background:linear-gradient(135deg,#2d205c,#1b1535);
  border-color:#8b6cff;
  color:#fff
}

.admin-exit{
  background:#3a1d25!important;
  color:#ff9baa
}

.status{
  padding:5px 9px;
  border-radius:9px;
  background:#252733;
  font-size:12px;
  font-weight:800
}

.profile{
  padding:35px 20px
}

.avatar{
  width:90px;
  height:90px;
  display:grid;
  place-items:center;
  border-radius:30px;
  background:linear-gradient(135deg,#8b6cff,#5b3be0);
  font-size:42px
}

.profile h2{
  margin-bottom:5px
}

.profile p{
  color:var(--muted)
}

.settings{
  margin-top:25px
}

.settings .admincard{
  cursor:pointer
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:680px){
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px
  }

  .photo{height:205px}

  .detailgrid,
  .formgrid{
    grid-template-columns:1fr
  }

  .detailimg{height:350px}

  .adminstat{
    grid-template-columns:1fr 1fr
  }

  .routegrid{
    grid-template-columns:1fr
  }

  .hero h1{font-size:34px}

  .admin-menu{
    overflow:auto;
    flex-wrap:nowrap
  }
}

@media(min-width:900px){
  .modal{
    align-items:center;
    padding:20px
  }

  .sheet{
    max-width:900px;
    border-radius:30px;
    margin:auto
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="logo">🛍️</div>

  <div class="hello">
    <small id="helloSmall">Добро пожаловать 👋</small>
    <b>NOVA SHOP</b>
  </div>

  <button class="icon" onclick="toast('Новых уведомлений нет')">🔔</button>
  <button class="icon" onclick="openMore()">⋮</button>
</header>

<div id="roleBanner" class="rolebanner hidden"></div>

<div class="search">
  <span>🔎</span>
  <input id="search" placeholder="Что вы хотите найти?" oninput="handleSearch()">
</div>

<main id="main"></main>

<nav class="bottom" id="bottomNav">
  <button id="nHome" class="nav active" onclick="go('home')">
    <i>⌂</i>Главная
  </button>

  <button id="nSearch" class="nav" onclick="go('search')">
    <i>⌕</i>Поиск
  </button>

  <button id="nCart" class="nav" onclick="openCart()">
    <i>🛍</i>
    <b id="badge" class="badge">0</b>
    Корзина
  </button>

  <button id="nOrders" class="nav" onclick="go('orders')">
    <i>▣</i>Заказы
  </button>

  <button id="nProfile" class="nav" onclick="go('profile')">
    <i>♙</i>Профиль
  </button>
</nav>

</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div id="sheet" class="sheet"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
'use strict';

const KEY='nova_shop_v3';

const defaultState={
  products:[
    {
      id:1,
      name:'Air Max Runner',
      cat:'Обувь',
      price:89.99,
      old:119.99,
      stock:14,
      rating:4.9,
      img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900',
      desc:'Лёгкие современные кроссовки для города.'
    },
    {
      id:2,
      name:'Premium Headphones',
      cat:'Техника',
      price:129.99,
      old:159.99,
      stock:8,
      rating:4.8,
      img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900',
      desc:'Беспроводные наушники с чистым звуком.'
    },
    {
      id:3,
      name:'Smart Watch Pro',
      cat:'Гаджеты',
      price:149.99,
      old:189.99,
      stock:10,
      rating:4.7,
      img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=900',
      desc:'Умные часы для спорта и повседневных задач.'
    },
    {
      id:4,
      name:'Minimal Backpack',
      cat:'Аксессуары',
      price:59.99,
      old:79.99,
      stock:20,
      rating:4.8,
      img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=900',
      desc:'Минималистичный рюкзак на каждый день.'
    },
    {
      id:5,
      name:'Classic Sneakers',
      cat:'Обувь',
      price:74.99,
      old:99.99,
      stock:16,
      rating:4.6,
      img:'https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=900',
      desc:'Классическая модель для ежедневной носки.'
    },
    {
      id:6,
      name:'Urban Jacket',
      cat:'Одежда',
      price:109.99,
      old:149.99,
      stock:7,
      rating:4.9,
      img:'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=900',
      desc:'Универсальная городская куртка.'
    },
    {
      id:7,
      name:'Modern Camera',
      cat:'Техника',
      price:399.99,
      old:459.99,
      stock:4,
      rating:4.9,
      img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=900',
      desc:'Камера для фото и видео.'
    },
    {
      id:8,
      name:'Leather Wallet',
      cat:'Аксессуары',
      price:39.99,
      old:54.99,
      stock:25,
      rating:4.7,
      img:'https://images.unsplash.com/photo-1627123424574-724758594e93?w=900',
      desc:'Классический кожаный кошелёк.'
    }
  ],

  cart:{},
  favorites:[],
  orders:[],
  courierRequests:[],
  couriers:[],

  config:{
    shopName:'NOVA SHOP',
    shopAddress:'Душанбе, проспект Рудаки',
    shopLat:38.5737,
    shopLng:68.7864,
    deliveryFee:3,
    paymentBank:'Alif Bank',
    paymentAccount:'0000 0000 0000 0000',
    paymentName:'NOVA SHOP'
  },

  profile:{
    name:'',
    phone:'',
    address:''
  }
};

let state=load();
let role=localStorage.getItem('nova_role')||'customer';
let category='all';
let currentPage='home';
let editingId=null;
let map=null;
let mapMarker=null;
let deliveryPoint=null;

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x?merge(defaultState,x):clone(defaultState);
  }catch(e){
    return clone(defaultState);
  }
}

function merge(a,b){
  const x=clone(a);
  Object.keys(b||{}).forEach(k=>{
    x[k]=b[k];
  });
  return x;
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  updateBadge();
}

function esc(v){
  return String(v??'').replace(/[&<>'"]/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#39;',
    '"':'&quot;'
  }[c]));
}

function money(n){
  return '$'+Number(n||0).toFixed(2);
}

function toast(t){
  const e=document.getElementById('toast');

  if(!e)return;

  e.textContent=t;
  e.classList.add('show');

  clearTimeout(window.tt);

  window.tt=setTimeout(()=>{
    e.classList.remove('show');
  },2300);
}

function updateBadge(){
  const badge=document.getElementById('badge');

  if(!badge)return;

  const count=Object.values(state.cart).reduce(
    (a,b)=>a+Number(b||0),
    0
  );

  badge.textContent=count;
}

function getProduct(id){
  return state.products.find(p=>p.id==id);
}

function setNav(active){
  document.querySelectorAll('.nav').forEach(x=>{
    x.classList.remove('active');
  });

  const ids={
    home:'nHome',
    search:'nSearch',
    orders:'nOrders',
    profile:'nProfile'
  };

  if(ids[active]){
    const el=document.getElementById(ids[active]);
    if(el)el.classList.add('active');
  }
}

function handleSearch(){
  if(role!=='customer')return;

  currentPage='home';
  renderHome();
}

function go(page){

  if(role==='admin'){
    renderAdmin();
    return;
  }

  if(role==='courier'){
    renderCourier();
    return;
  }

  currentPage=page;
  setNav(page);

  if(page==='home')renderHome();
  if(page==='search')renderSearch();
  if(page==='orders')renderOrders();
  if(page==='profile')renderProfile();
}

function renderHome(){

  currentPage='home';
  setNav('home');

  const search=document.getElementById('search');

  const q=search
    ? search.value.trim().toLowerCase()
    : '';

function toggleFav(id){

  const i=state.favorites.indexOf(id);

  if(i>=0){
    state.favorites.splice(i,1);
  }else{
    state.favorites.push(id);
  }

  save();
  renderHome();
}

function addCart(id){

  const p=getProduct(id);

  if(!p)return;

  if(p.stock<1){
    return toast('Товар закончился');
  }

  const q=Number(state.cart[id]||0);

  if(q>=p.stock){
    return toast('Больше товара нет на складе');
  }

  state.cart[id]=q+1;

  save();

  toast('Товар добавлен в корзину');
}

function changeQty(id,d){

  const p=getProduct(id);

  if(!p)return;

  const q=Number(state.cart[id]||0)+d;

  if(q<=0){
    delete state.cart[id];
  }
  else if(q<=p.stock){
    state.cart[id]=q;
  }
  else{
    return toast('На складе осталось: '+p.stock);
  }

  save();
  openCart();
}

function cartItems(){

  return Object.entries(state.cart)
    .map(([id,q])=>({
      p:getProduct(id),
      q:Number(q)
    }))
    .filter(x=>x.p);
}

function cartTotal(){

  return cartItems().reduce(
    (s,x)=>s+x.p.price*x.q,
    0
  );
}

function initCheckoutMap(){

  if(!window.L)return;

  const el=document.getElementById('checkoutMap');

  if(!el)return;

  if(map){
    map.remove();
    map=null;
  }

  map=L.map(el).setView(
    [state.config.shopLat,state.config.shopLng],
    12
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }
  ).addTo(map);

  L.marker([
    state.config.shopLat,
    state.config.shopLng
  ])
  .addTo(map)
  .bindPopup('NOVA SHOP')
  .openPopup();

  map.on('click',e=>{
    setDeliveryPoint(
      e.latlng.lat,
      e.latlng.lng
    );
  });
}

function setDeliveryPoint(lat,lng){

  deliveryPoint={lat,lng};

  if(mapMarker&&map){
    map.removeLayer(mapMarker);
  }

  if(map){
    mapMarker=L.marker([lat,lng])
      .addTo(map)
      .bindPopup('Ваша доставка')
      .openPopup();
  }

  toast('Точка доставки выбрана');
}

function locateMe(){

  if(!navigator.geolocation){
    return toast('Геолокация недоступна');
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{

      setDeliveryPoint(
        pos.coords.latitude,
        pos.coords.longitude
      );

      if(map){
        map.setView(
          [
            pos.coords.latitude,
            pos.coords.longitude
          ],
          15
        );
      }

    },
    ()=>{
      toast('Не удалось получить местоположение');
    }
  );
}

function placeOrder(){

  const name=document.getElementById('cName')?.value.trim()||'';
  const phone=document.getElementById('cPhone')?.value.trim()||'';
  const address=document.getElementById('cAddress')?.value.trim()||'';
  const note=document.getElementById('cNote')?.value.trim()||'';

  if(!name||!phone||!address){
    return toast('Заполните имя, телефон и адрес');
  }

  if(!deliveryPoint){
    return toast('Поставьте точку на карте');
  }

  const items=cartItems();

  const order={
    id:'NS-'+Date.now().toString().slice(-7),
    created:new Date().toLocaleString('ru-RU'),
    name,
    phone,
    address,
    note,
    lat:deliveryPoint.lat,
    lng:deliveryPoint.lng,
    from:state.config.shopAddress,
    shopLat:state.config.shopLat,
    shopLng:state.config.shopLng,

    items:items.map(x=>({
      id:x.p.id,
      name:x.p.name,
      price:x.p.price,
      qty:x.q,
      img:x.p.img
    })),

    subtotal:cartTotal(),
    delivery:state.config.deliveryFee,
    total:cartTotal()+state.config.deliveryFee,
    status:'Принят',

    payment:
      document.querySelector('input[name="pay"]:checked')?.value
      ||'transfer',

    courierId:null
  };

  state.orders.unshift(order);

  items.forEach(x=>{
    x.p.stock-=x.q;
  });

  state.profile={
    name,
    phone,
    address
  };

  state.cart={};

  save();

  deliveryPoint=null;

  closeModal();

  toast('Заказ '+order.id+' принят');

  go('orders');
}

function initRouteMap(o,id){

  if(!window.L)return;

  const el=document.getElementById(id);

  if(!el)return;

  const m=L.map(el).setView(
    [o.lat,o.lng],
    12
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }
  ).addTo(m);

  const a=[
    o.shopLat,
    o.shopLng
  ];

  const b=[
    o.lat,
    o.lng
  ];

  L.marker(a)
    .addTo(m)
    .bindPopup('Магазин');

  L.marker(b)
    .addTo(m)
    .bindPopup('Клиент');

  L.polyline(
    [a,b],
    {
      color:'#8b6cff',
      weight:5
    }
  ).addTo(m);

  m.fitBounds(
    [a,b],
    {
      padding:[25,25]
    }
  );
}

function saveProduct(){

  const name=document.getElementById('aName')?.value.trim()||'';
  const cat=document.getElementById('aCat')?.value.trim()||'Другое';
  const price=Number(
    document.getElementById('aPrice')?.value
  );

  const old=Number(
    document.getElementById('aOld')?.value
  )||0;

  const stock=Math.max(
    0,
    Number(document.getElementById('aStock')?.value)||0
  );

  const rating=Math.min(
    5,
    Math.max(
      0,
      Number(document.getElementById('aRating')?.value)||5
    )
  );

  const img=
    document.getElementById('aImg')?.value.trim()
    ||
    'https://placehold.co/800x800/181a23/ffffff?text=PRODUCT';

  const desc=
    document.getElementById('aDesc')?.value.trim()||'';

  if(!name||!Number.isFinite(price)||price<0){
    return toast('Проверьте название и цену');
  }

  const p={
    id:editingId||Date.now(),
    name,
    cat,
    price,
    old,
    stock,
    rating,
    img,
    desc
  };

  const i=state.products.findIndex(
    x=>x.id===editingId
  );

  if(i>=0){
    state.products[i]=p;
  }else{
    state.products.unshift(p);
  }

  save();

  closeModal();

  adminProducts();

  toast('Товар сохранён');
}

function quickPrice(id){

  const p=getProduct(id);

  if(!p)return;

  const v=prompt(
    'Новая цена для '+p.name,
    p.price
  );

  if(
    v!==null&&
    Number.isFinite(Number(v))&&
    Number(v)>=0
  ){

    p.price=Number(v);

    save();

    adminProducts();

    toast('Цена изменена');
  }
}

function quickStock(id){

  const p=getProduct(id);

  if(!p)return;

  const v=prompt(
    'Новое количество на складе',
    p.stock
  );

  if(
    v!==null&&
    Number.isFinite(Number(v))&&
    Number(v)>=0
  ){

    p.stock=Math.floor(Number(v));

    save();

    adminProducts();

    toast('Остаток изменён');
  }
}

function deleteProduct(id){

  if(!confirm('Удалить товар?'))return;

  state.products=state.products.filter(
    p=>p.id!==id
  );

  delete state.cart[id];

  save();

  adminProducts();

  toast('Товар удалён');
}

function approveCourier(i){

  const r=state.courierRequests[i];

  if(!r)return;

  r.status='Одобрено';

  if(
    !state.couriers.some(
      c=>c.phone===r.phone
    )
  ){

    state.couriers.push({
      id:'C-'+Date.now(),
      name:r.name,
      phone:r.phone,
      vehicle:r.vehicle
    });

  }

  save();

  adminCouriers();

  toast('Доставщик одобрен');
}

function rejectCourier(i){

  if(!state.courierRequests[i])return;

  state.courierRequests[i].status='Отклонено';

  save();

  adminCouriers();

  toast('Заявка отклонена');
}

function sendCourierRequest(){

  const name=
    document.getElementById('rName')?.value.trim()
    ||'';

  const phone=
    document.getElementById('rPhone')?.value.trim()
    ||'';

  const vehicle=
    document.getElementById('rVehicle')?.value
    ||'Автомобиль';

  if(!name||!phone){
    return toast('Заполните имя и телефон');
  }

  if(
    state.courierRequests.some(
      r=>
        r.phone===phone&&
        r.status==='На рассмотрении'
    )
  ){
    return toast('Такая заявка уже есть');
  }

  state.courierRequests.unshift({
    id:'R-'+Date.now(),
    name,
    phone,
    vehicle,
    status:'На рассмотрении',
    created:new Date().toLocaleString('ru-RU')
  });

  state.profile.name=name;
  state.profile.phone=phone;

  save();

  closeModal();

  toast('Заявка отправлена администратору');
}

function initCourierMap(){

  if(!window.L)return;

  const el=document.getElementById('courierMap');

  if(!el)return;

  const m=L.map(el).setView(
    [
      state.config.shopLat,
      state.config.shopLng
    ],
    12
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }
  ).addTo(m);

  L.marker([
    state.config.shopLat,
    state.config.shopLng
  ])
  .addTo(m)
  .bindPopup('NOVA SHOP');

  state.orders
    .filter(
      o=>
        !o.courierId&&
        ['Принят','Собирается'].includes(o.status)
    )
    .forEach(o=>{

      L.marker([
        o.lat,
        o.lng
      ])
      .addTo(m)
      .bindPopup(
        esc(o.id)+' — '+esc(o.address)
      );

    });
}

function takeOrder(id){

  const o=state.orders.find(
    x=>x.id===id
  );

  if(!o)return;

  if(o.courierId){
    return toast('Этот заказ уже взят');
  }

  const courier=state.couriers[0];

  o.courierId=
    courier?.id||
    'courier-demo';

  o.status='В пути';

  save();

  courierOrder(id);
}

  },150);
}

function courierStatus(id,s){

  const o=state.orders.find(
    x=>x.id===id
  );

  if(!o)return;

  o.status=s;

  save();

  closeModal();

  renderCourier();

  toast('Статус: '+s);
}

function exitRole(){

  role='customer';

  localStorage.setItem(
    'nova_role',
    'customer'
  );

  const bottom=document.getElementById('bottomNav');
  const search=document.querySelector('.search');
  const banner=document.getElementById('roleBanner');

  if(bottom)bottom.style.display='flex';
  if(search)search.style.display='flex';

  if(banner){
    banner.classList.add('hidden');
    banner.innerHTML='';
  }

  go('home');
}

function renderSearch(){

  const search=document.getElementById('search');

  const q=search
    ?search.value.trim().toLowerCase()
    :'';

  const list=state.products.filter(p=>
    !q||
    p.name.toLowerCase().includes(q)||
    p.cat.toLowerCase().includes(q)
  );

  document.getElementById('main').innerHTML=`

<section class="section">

  <div class="head">

    <h2>Поиск</h2>

    <span class="link">
      ${list.length} товаров
    </span>

  </div>

  <div class="grid">

    ${
      list.length
      ?list.map(productCard).join('')
      :'<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>'
    }

  </div>

</section>

`;

  if(search){
    search.focus();
  }
}

function closeModal(){

  if(map){
    map.remove();
    map=null;
  }

  mapMarker=null;

  document
    .getElementById('modal')
    .classList.remove('show');

  document
    .getElementById('sheet')
    .innerHTML='';
}

function showModal(html){

  document
    .getElementById('sheet')
    .innerHTML=html;

  document
    .getElementById('modal')
    .classList.add('show');
}

/* =========================
   ЗАПУСК
========================= */

function boot(){

  updateBadge();

  if(role==='admin'){
    renderAdmin();
    return;
  }

  if(role==='courier'){
    renderCourier();
    return;
  }

  const name=state.profile.name;

  if(name){
    const hello=document.getElementById('helloSmall');

    if(hello){
      hello.textContent='Привет, '+name+' 👋';
    }
  }

  renderHome();
}

boot();

</script>
